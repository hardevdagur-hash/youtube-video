[tox]
isolated_build = true
envlist = py311, py312, lint, type-check, security, coverage
skip_missing_interpreters = true

[base]
deps =
    -rrequirements-dev.txt
    pytest-asyncio
    pytest-cov
    pytest-timeout
    httpx

[testenv]
deps =
    {[base]deps}
commands =
    pytest tests/unit/ -v --timeout=60 -m "unit" -x
    pytest tests/integration/ -v --timeout=120 -m "integration" -x

[testenv:lint]
deps =
    black
    ruff
commands =
    black --check --line-length=100 .
    ruff check --no-fix --line-length=100 .

[testenv:type-check]
deps =
    mypy
commands =
    mypy --ignore-missing-imports .

[testenv:security]
deps =
    bandit
commands =
    bandit --skip=B101 --exclude=tests,venv -r .

[testenv:coverage]
deps =
    {[base]deps}
    coverage
commands =
    coverage run -m pytest tests/unit/ tests/integration/ -v --timeout=120 -m "unit or integration"
    coverage report --fail-under=95
    coverage xml

[testenv:full]
deps =
    {[base]deps}
    coverage
commands =
    coverage run -m pytest tests/ -v --timeout=300 --ignore=tests/load --ignore=tests/stress --ignore=tests/chaos
    coverage report --fail-under=90
    coverage xml
