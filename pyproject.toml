[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-transcript-service"
version = "1.0.0"
description = "Single-instance YouTube transcript service: single videos, channel jobs, translation and CSV export"
requires-python = ">=3.11"
authors = [
    {name = "Rishi", email = "rishi@example.com"},
]

[tool.ruff]
target-version = "py311"
line-length = 100
# Never auto-fix by default: `ruff check .` must be read-only so audits and CI
# cannot mutate source. Fix explicitly with `ruff check . --fix` (or `make format`).
fix = false

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "PT", "S", "C4", "T20"]
# E501: line length is not enforced. N818: renaming the public exception classes
# (ApplicationException, QualityCheckFailed) would be churn without benefit.
ignore = ["E501", "N818"]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts, fixed fake credentials, fakes whose signatures mirror real interfaces.
"tests/*" = ["S101", "S105", "S106", "S311", "ARG", "PT004", "PT011", "PT018"]
# CLI tools print to the terminal by design.
"scripts/*" = ["T201"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*", "venv/*"]
branch = true
