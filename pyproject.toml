[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-transcript-service"
version = "1.0.0"
description = "Single-instance YouTube transcript service: single videos, channel jobs, translation and CSV export"
requires-python = ">=3.11"
authors = [
    {name = "Rishi", email = "rishi@example.com"},
]

[tool.ruff]
target-version = "py311"
line-length = 100
# Never auto-fix by default: `ruff check .` must be read-only so audits and CI
# cannot mutate source. Fix explicitly with `ruff check . --fix` (or `make format`).
fix = false

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "PT", "S", "C4", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*", "venv/*"]
branch = true
