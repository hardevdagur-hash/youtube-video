version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
      target: builder
    command: uvicorn webapp.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
    volumes:
      - ..:/app:delegated
      - exclude:/app/venv
      - exclude:/app/frontend/node_modules
    environment:
      APP_ENV: development
      LOG_LEVEL: DEBUG
      DB_DRIVER: sqlite
      DB_PATH: data/yt_platform_dev.db
    ports:
      - "8000:8000"
      - "5678:5678"

  worker:
    command: celery -A background_processing.celery_app worker --loglevel=debug --concurrency=2 -Q critical,high,default,low,background,system,dead_letter
    volumes:
      - ..:/app:delegated

  beat:
    volumes:
      - ..:/app:delegated

  frontend:
    build:
      dockerfile: ../Dockerfile.frontend
      target: build
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ../frontend:/app:delegated
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000

  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    volumes:
      - redis_insight_data:/data

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  redis_insight_data:
  exclude:
