# nginx: TLS termination and reverse proxy for the transcript service.
# Certificates: docker/nginx/certs/{fullchain.pem,privkey.pem} (scripts/init-tls.sh).

worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '$request_time "$http_user_agent" rid=$request_id';
    access_log /dev/stdout main;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # The API only accepts small JSON bodies.
    client_max_body_size 1m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/csv application/javascript application/json image/svg+xml;

    # Coarse per-IP flood protection; per-user limits are enforced by the app.
    limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
    limit_req_status 429;

    upstream app {
        server app:8000;
        keepalive 16;
    }

    # ------------------------------------------------------------------ HTTP
    server {
        listen 80 default_server;
        server_name _;

        # Container health probe (also reachable from the host; returns no data).
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Let's Encrypt HTTP-01 challenges (scripts/init-tls.sh letsencrypt ...).
        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ----------------------------------------------------------------- HTTPS
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # X-Frame-Options, X-Content-Type-Options and Referrer-Policy come from the app.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;

        # API: transcript fetches with speech-to-text and synchronous channel runs
        # (MAX_VIDEOS_SYNC_EXPORT videos) can take minutes.
        location /api/ {
            limit_req zone=perip burst=40 nodelay;
            proxy_pass http://app;
            proxy_read_timeout 600s;
            proxy_send_timeout 60s;
        }

        # Fingerprinted SPA bundles.
        location /assets/ {
            proxy_pass http://app;
            proxy_read_timeout 30s;
            expires 1y;
        }

        # SPA shell, favicon and client-side routes.
        location / {
            proxy_pass http://app;
            proxy_read_timeout 30s;
        }
    }
}
