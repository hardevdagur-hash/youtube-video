# API upstream with caching rules for read endpoints
location ~ ^/api/v1/(exports)(/\d+)?$ {
    proxy_pass http://api_servers;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Cache GET requests for list endpoints
    proxy_cache api;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 1m;
    proxy_cache_use_stale error timeout updating;
    proxy_no_cache $http_authorization;
    proxy_cache_bypass $http_cache_control;
    add_header X-Cache-Status $upstream_cache_status;
}

# Export endpoints (rate limited)
location ~ ^/api/v1/export/ {
    proxy_pass http://api_servers;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    limit_req zone=export_limit burst=10 nodelay;
}

