[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    performance: Performance tests (slow, measure latency/throughput)
    security: Security tests (auth, injection, OWASP)
    chaos: Chaos engineering tests (fault injection, recovery)
    load: Load tests (concurrent users, throughput)
    stress: Stress tests (system beyond capacity)
    e2e: End-to-end tests (full user journey)
    regression: Regression tests (compare against baselines)
    ai_regression: AI regression tests (prompt/output quality)
    benchmark: Benchmark tests (timed execution)
    integration: Integration tests (module interaction)
    unit: Unit tests (isolated module testing)
    slow: Slow tests (excluded from quick runs)
    flaky: Flaky tests (known intermittent failures)
    db: Database tests (transactions, migrations, concurrency)
    cache: Cache tests (hit/miss, TTL, eviction)
    export: Export format tests (markdown, html, pdf...)
    prompt: Prompt management tests (rendering, variables)
    background_job: Background job tests (queue, retry, DLQ)
    accessibility: Accessibility tests (WCAG, keyboard, screen reader)
    smoke: Smoke tests against a running deployment (SMOKE_TEST_URL)
    live: Live tests against real YouTube/Groq (RUN_LIVE_TESTS=1; costs quota)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
log_cli = true
log_cli_level = INFO
# Opt-in suites: pytest -m smoke tests/smoke (SMOKE_TEST_URL=...), RUN_LIVE_TESTS=1 pytest -m live tests/live
addopts = --strict-markers --tb=short -p no:cacheprovider -m "not smoke and not live"
