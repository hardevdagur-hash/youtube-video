name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly dependency audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*
      - run: pip install -r requirements-dev.txt
      - name: Lint (read-only, never --fix)
        run: ruff check . --no-fix
      - name: Tests
        run: pytest -o log_cli=false -q

  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc -b
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build

  shell:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -x -S style scripts/*.sh tests/deployment/*.sh

  stack:
    # Builds the production image and runs the real docker compose stack
    # (nginx + TLS + app + volume): smoke, persistence, backup and restore.
    if: github.event_name != 'schedule'
    needs: [backend, frontend, shell]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test configuration (throwaway credentials)
        run: |
          raw_key="ysk_$(openssl rand -hex 24)"
          other_key="ysk_$(openssl rand -hex 24)"
          echo "::add-mask::$raw_key"
          echo "::add-mask::$other_key"
          echo "CI_API_KEY=$raw_key" >> "$GITHUB_ENV"
          echo "CI_OTHER_API_KEY=$other_key" >> "$GITHUB_ENV"
          hash() { printf '%s' "$1" | sha256sum | cut -d' ' -f1; }
          {
            echo "APP_ENV=production"
            echo "JWT_SECRET_KEY=$(openssl rand -hex 32)"
            echo "API_KEYS=ci:user:$(hash "$raw_key"),ci-other:user:$(hash "$other_key")"
            echo "CORS_ORIGINS=https://ci.example.test"
            echo "YOUTUBE_API_KEY=ci-dummy-youtube-key"
            echo "GROQ_API_KEY="
          } > .env
          scripts/init-tls.sh self-signed localhost
      - name: Deploy
        run: SKIP_BACKUP=1 scripts/deploy.sh
      - name: Smoke tests
        run: |
          pip install pytest httpx
          SMOKE_TEST_URL=https://127.0.0.1 SMOKE_TEST_INSECURE=1 SMOKE_TEST_API_KEY="$CI_API_KEY" \
            pytest -p no:cacheprovider -o addopts="" -m smoke tests/smoke -q
      - name: Isolation, persistence (restart + down/up), backup, restore, rollback
        run: API_KEY="$CI_API_KEY" OTHER_API_KEY="$CI_OTHER_API_KEY" tests/deployment/stack_test.sh
      - name: Container logs
        if: always()
        run: docker compose logs --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v

  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Python dependency audit
        run: pip-audit -r requirements.lock --desc on
      - name: npm audit (production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
