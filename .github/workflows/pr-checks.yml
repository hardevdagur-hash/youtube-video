name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  quick-checks:
    name: Quick Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Changed files check
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '\.py$' || true)
          if [ -n "$CHANGED" ]; then
            black --check --line-length=100 $CHANGED
            ruff check --no-fix --line-length=100 $CHANGED
          fi
      - name: Run smoke tests
        run: pytest -m "smoke" -v --timeout=60
      - name: Run unit tests for changed modules
        run: |
          pytest tests/unit/ -v --timeout=120 -m "unit" -x

  label-check:
    name: Label Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        continue-on-error: true
