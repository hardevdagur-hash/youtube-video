name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version to deploy (tag or commit SHA)'
        required: false
        default: ''
      skip_tests:
        description: 'Skip test pipeline'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/youtube-seo-blog
  DEPLOYMENT_VERSION: ${{ github.sha }}
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # SECRETS SCAN
  # ============================================================
  secrets-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: HEAD

  # ============================================================
  # BUILD & TEST
  # ============================================================
  build-and-test:
    name: Build & Test
    needs: secrets-scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pytest-asyncio pytest-cov pytest-timeout httpx
      - name: Lint
        run: |
          black --check --line-length=100 .
          ruff check --no-fix --line-length=100 .
      - name: Type check
        run: mypy --ignore-missing-imports .
      - name: Unit tests
        run: |
          pytest tests/unit/ -v --timeout=60 -m "unit" --cov=. --cov-report=xml --cov-fail-under=95 -x
      - name: Integration tests
        run: |
          pytest tests/integration/ -v --timeout=120 -m "integration" --cov=. --cov-report=xml --cov-fail-under=90 -x
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================
  # DOCKER BUILD & PUSH
  # ============================================================
  docker-build:
    name: Docker Build & Push
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker, beat, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          buildkitd-flags: --debug
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          secrets: |
            "github_token=${{ secrets.GITHUB_TOKEN }}"
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-results-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
        continue-on-error: true
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
        continue-on-error: true

  # ============================================================
  # DEPLOYMENT
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    needs: docker-build
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.yourdomain.com
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.STAGING_HOST_KEY }}" >> ~/.ssh/known_hosts
      - name: Deploy with Docker Compose
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} \
            "cd /opt/youtube-seo-blog && \
             docker compose pull && \
             docker compose up -d --remove-orphans && \
             docker system prune -af --volumes"
      - name: Health check
        run: |
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://staging.yourdomain.com/api/v1/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Staging deployment healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after 5 minutes"
          exit 1
      - name: Smoke tests
        run: |
          pip install httpx pytest
          python -m pytest tests/smoke/ -v --timeout=60 --base-url=https://staging.yourdomain.com

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    if: (github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production') && github.event.inputs.environment != 'staging'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://yourdomain.com
    steps:
      - uses: actions/checkout@v4
      - name: Notify deployment start
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-Type: application/json' \
            -d '{"text":"🚀 Production deployment started: ${{ github.sha }}"}'
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.PROD_HOST_KEY }}" >> ~/.ssh/known_hosts
      - name: Blue-green deploy
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.PROD_USER }}@${{ secrets.PROD_HOST }} \
            "bash /opt/youtube-seo-blog/scripts/deploy.sh production ${{ github.sha }}"
      - name: Health check
        run: |
          for i in {1..60}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://yourdomain.com/api/v1/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Production deployment healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after 10 minutes"
          exit 1
      - name: Smoke tests
        run: |
          python -m pytest tests/smoke/ -v --timeout=120 --base-url=https://yourdomain.com
      - name: Notify deployment success
        if: success()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-Type: application/json' \
            -d '{"text":"✅ Production deployment successful: ${{ github.sha }}"}'
      - name: Notify deployment failure
        if: failure()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-Type: application/json' \
            -d '{"text":"❌ Production deployment FAILED: ${{ github.sha }}. Initiating rollback..."}'
          # Trigger rollback
          gh workflow run rollback.yml -f environment=production -f version=${{ github.sha }}

  # ============================================================
  # VERSION TAG
  # ============================================================
  version-tag:
    name: Create Version Tag
    needs: [deploy-production, deploy-staging]
    if: github.ref == 'refs/heads/main' && success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate version
        id: version
        run: |
          DATE=$(date +'%Y%m%d')
          RUN=${{ github.run_number }}
          echo "tag=v${DATE}-${RUN}" >> $GITHUB_OUTPUT
      - name: Create and push tag
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
